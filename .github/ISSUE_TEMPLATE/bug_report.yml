name: Bug report
description: Something in Hive does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new thread in a repo
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hive version or commit
      placeholder: 0.1.0, or the commit sha when running from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, macOS, Other]
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: DevTools console output (Ctrl+Shift+I) or the terminal running `npm run dev`. Remove anything private first.
      render: text
