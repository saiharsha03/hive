name: Release

# Started by hand only (Actions > Release > Run workflow): releases are published from a checked local build, and a
# run on every tag push would upload its own installers over them (and they would not match latest.yml)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hive ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
